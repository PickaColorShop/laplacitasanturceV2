<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Mapa abstracto de calles (Santurce). Una sola imagen de fondo para todo el sitio. -->
  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>
  <g fill="none" stroke="#1C1A17" stroke-linecap="round" filter="url(#blur)">
    <!-- avenidas principales -->
    <g stroke-opacity=".10" stroke-width="18">
      <path d="M-50 820 C 300 700, 600 640, 1000 470 S 1500 210, 1700 120"/>
      <path d="M180 -40 C 260 300, 330 620, 420 1050"/>
    </g>
    <!-- calles secundarias -->
    <g stroke-opacity=".08" stroke-width="7">
      <path d="M-40 140 L1640 60"/><path d="M-40 300 L1640 230"/><path d="M-40 470 L1640 400"/>
      <path d="M-40 640 L1640 590"/><path d="M-40 900 L1640 860"/>
      <path d="M560 -40 L600 1040"/><path d="M820 -40 L840 1040"/><path d="M1080 -40 L1060 1040"/><path d="M1330 -40 L1290 1040"/>
    </g>
    <!-- calles pequeñas -->
    <g stroke-opacity=".06" stroke-width="3">
      <path d="M-40 220 L1640 145"/><path d="M-40 385 L1640 315"/><path d="M-40 555 L1640 495"/><path d="M-40 770 L1640 725"/>
      <path d="M440 -40 L480 1040"/><path d="M690 -40 L720 1040"/><path d="M950 -40 L950 1040"/><path d="M1210 -40 L1175 1040"/><path d="M1460 -40 L1410 1040"/>
      <path d="M60 -40 L120 1040"/>
    </g>
    <!-- diagonales y curvas -->
    <g stroke-opacity=".07" stroke-width="5">
      <path d="M700 1040 L1640 300"/>
      <path d="M-40 60 C 200 180, 380 160, 560 330 S 900 520, 1100 760 S 1400 960, 1640 990"/>
    </g>
    <!-- la plaza (punto de referencia) -->
    <rect x="860" y="410" width="120" height="90" rx="6" stroke="#D2432B" stroke-opacity=".22" stroke-width="5" transform="rotate(-3 920 455)"/>
  </g>
</svg>
